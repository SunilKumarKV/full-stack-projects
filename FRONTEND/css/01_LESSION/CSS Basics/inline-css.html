<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS</title>
</head>
<body>
    <main>
        <h1 style="color: blue; text-align: center;">Welcome to Inline CSS</h1>
        <p style="font-size: 18px; color: gray;">This is an example of using inline CSS to style HTML elements directly within the HTML tags.</p>
        <button style="background-color: green; color: white; padding: 10px 20px; border: none; cursor: pointer;">Click Me</button>
    </main>
</body>
</html>
